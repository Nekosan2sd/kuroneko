<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>中川URL保管庫</title>

<style>

*{
    box-sizing:border-box;
}

body{
    max-width:1000px;
    margin:auto;
    padding:20px;
    background:#f8f8f8;
    color:#222;
    font-family:"Yu Mincho","Hiragino Mincho ProN",serif;
    line-height:1.8;
}

h1{
    font-size:clamp(32px,5vw,48px);
    margin-bottom:10px;
}

.count{
    color:#666;
    margin-bottom:30px;
}

ul{
    list-style:none;
    padding:0;
}

li{
    padding:20px 0;
}

a{
    color:#003399;
    word-break:break-all;
}

hr{
    border:none;
    border-top:1px solid #bbb;
    margin:0;
}

footer{
    margin-top:40px;
    color:#666;
    font-size:14px;
}

@media (max-width:768px){
    body{
        padding:15px;
    }
}

</style>
</head>

<body>

<h1>中川URL保管庫</h1>

<div class="count">

</div>

<ul>

<li>

<strong>URL：</strong><br>
https://example1.com
https://example1.com
</a>

<br><br>

<strong>説明：</strong><br>

</li>

<hr>

<li>

<hr>

<footer>

</footer>

</body>
</html>
