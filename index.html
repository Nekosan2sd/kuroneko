<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuroneko Network</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#0f172a,#1e293b,#111827);
color:white;
display:flex;
justify-content:center;
padding:30px;
}

.container{
width:100%;
max-width:1000px;
}

header{
text-align:center;
margin-bottom:30px;
}

.logo{
font-size:4rem;
margin-bottom:10px;
}

h1{
font-size:3rem;
}

.subtitle{
opacity:.8;
margin-top:10px;
}

.search{
margin:30px 0;
}

.search input{
width:100%;
padding:15px;
border:none;
border-radius:15px;
background:rgba(255,255,255,.1);
backdrop-filter:blur(10px);
color:white;
font-size:1rem;
outline:none;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
text-decoration:none;
color:white;
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.1);
backdrop-filter:blur(15px);
padding:25px;
border-radius:20px;
transition:.3s;
}

.card:hover{
transform:translateY(-8px);
background:rgba(255,255,255,.15);
box-shadow:0 15px 40px rgba(0,0,0,.3);
}

.icon{
font-size:2.5rem;
margin-bottom:10px;
}

.card h2{
margin-bottom:10px;
}

.card p{
opacity:.8;
line-height:1.5;
}

footer{
text-align:center;
margin-top:40px;
opacity:.6;
}
</style>
</head>
<body>

<div class="container">

<header>
<div class="logo">🐈‍⬛</div>
<h1>Kuroneko Network</h1>
<p class="subtitle">サイト集ポータル</p>
</header>

<div class="search">
<input
type="text"
id="search"
placeholder="サイトを検索..."
>
</div>

<div class="grid" id="sites">

<a class="card" href🎮</div>
<h2>Games</h2>
<p>ゲームや実験作品</p>
</a>

<a classlass="icon">🛠️</div>
<h2>Tools</h2>
<p>便利ツール集</p>
</a>

<a classlass="icon">📚</div>
<h2>Study</h2>
<p>学習メモや資料</p>
</a>

#
<div class="icon">📝</div>
<h2>Blog</h2>
<p>開発日記や雑記</p>
</a>

#
<div class="icon">💬</div>
<h2>Community</h2>
<p>コミュニティ関連</p>
</a>

#
<div class="icon">👤</div>
<h2>Profile</h2>
<p>自己紹介ページ</p>
</a>

</div>

<footer>
© 2026 Kuroneko Network
</footer>

</div>

<script>
const search = document.getElementById("search");

search.addEventListener("input", () => {
const keyword = search.value.toLowerCase();

document.querySelectorAll(".card").forEach(card => {
const text = card.innerText.toLowerCase();

card.style.display =
text.includes(keyword)
? "block"
: "none";
});
});
</script>

</body>
</html>
